# 애플리케이션 이름
spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# 서버 포트
server.port=8080
debug=false
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.mybatis=INFO

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/chatterland?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:ctland}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-statement-timeout=15
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.audio.storage-path=${AUDIO_STORAGE_PATH:./storage/audio}
app.providers.connect-timeout=${AI_CONNECT_TIMEOUT:5s}
app.providers.read-timeout=${AI_READ_TIMEOUT:60s}
app.ai.endpoint=${AI_API_URL:}
app.ai.api-key=${AI_API_KEY:}
app.speech.endpoint=${SPEECH_API_URL:}
app.speech.api-key=${SPEECH_API_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 음성 분석 엔진: local(서버 로컬 whisper.cpp, 기본) | external(SPEECH_API_URL 외부 제공자)
app.speech.engine=${SPEECH_ENGINE:local}
app.speech.local.cli-path=${WHISPER_CLI_PATH:whisper-cli}
app.speech.local.model-path=${WHISPER_MODEL_PATH:${user.home}/.cache/chatterland/whisper/ggml-large-v3-turbo-q5_0.bin}
app.speech.local.language=ko
app.speech.local.threads=${WHISPER_THREADS:4}
app.speech.local.timeout=${WHISPER_TIMEOUT:60s}
app.speech.local.max-concurrency=${WHISPER_MAX_CONCURRENCY:1}
app.speech.local.min-duration-ms=300
app.speech.local.max-duration-ms=30000

# 비밀번호 재설정 메일(SMTP). MAIL_HOST가 비어 있으면 메일 기능은 503으로 응답한다(우회 인증 없음).
# 개발 환경: mailpit(MAIL_HOST=localhost, MAIL_PORT=1025) 같은 테스트 메일 서버를 사용한다.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
app.mail.from=${MAIL_FROM:}

# 아동 음성 파일 보관 기간(개월)과 만료 파일 삭제 주기(매일 03:30, 한국 시간)
app.audio.retention-months=${AUDIO_RETENTION_MONTHS:6}
app.audio.retention-cron=${AUDIO_RETENTION_CRON:0 30 3 * * *}
app.audio.retention-zone=Asia/Seoul
