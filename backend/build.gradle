plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}
dependencies {

    // Spring MVC 기반 웹 애플리케이션 개발
    // REST API(@RestController), 요청 매핑(@GetMapping),
    // JSON 변환 등을 제공
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

    // 인증(Authentication) 및 인가(Authorization)
    // 로그인, 권한 관리, JWT 연동 시 사용
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 요청 데이터 검증
    // @Valid, @NotBlank, @Email, @Size 등을 사용
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    // Lombok 사용
    // 컴파일 시 Getter, Setter, Builder 등을 자동 생성
    compileOnly 'org.projectlombok:lombok'

    // Lombok 어노테이션 처리기
    annotationProcessor 'org.projectlombok:lombok'

    // Spring Boot 통합 테스트
    // JUnit5, MockMvc, AssertJ 등을 포함
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // Spring Security 관련 테스트 지원
    // @WithMockUser 등을 사용 가능
    testImplementation 'org.springframework.security:spring-security-test'

    // 테스트 코드에서도 Lombok 사용
    testCompileOnly 'org.projectlombok:lombok'

    // 테스트 코드 Lombok 어노테이션 처리기
    testAnnotationProcessor 'org.projectlombok:lombok'

    //jjwt-api
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // 비밀번호 재설정 인증 코드 메일 발송 (SMTP)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 한글 글꼴을 임베딩한 PDF 리포트 생성 (Apache License 2.0)
    implementation 'org.apache.pdfbox:pdfbox:3.0.7'

    // 테스트용 인메모리 SMTP 서버 (Apache License 2.0)
    testImplementation 'com.icegreen:greenmail-junit5:2.1.3'
}

// ── 테스트 실행 구성 ──────────────────────────────────────────────
// unitTest: DB 없이 실행(서비스·검증·분석 로직). integrationTest: 테스트 전용 DB(scripts/test-db.sh)가 반드시 필요.
// test: 전체(단위+통합). 통합 테스트는 개발용 .env DB로 절대 실행하지 않는다(테스트 DB가 없으면 원인을 표시하고 실패).
// REQUIRE_SPEECH_MODEL=true / REQUIRE_MAILPIT=true 이면 whisper 모델·Mailpit 누락을 SKIPPED가 아니라 FAIL로 처리한다(CI).
def integrationPatterns = ['**/*IntegrationTest.class', '**/BackendApplicationTests.class']
def testDbEnv = [:]
def testDbEnvFile = file("${layout.buildDirectory.get().asFile}/test-db/env")
if (testDbEnvFile.exists()) testDbEnvFile.eachLine { line -> def i = line.indexOf('='); if (i > 0) testDbEnv[line.substring(0, i)] = line.substring(i + 1) }
['TEST_DB_URL', 'TEST_DB_USERNAME', 'TEST_DB_PASSWORD'].each { key -> if (System.getenv(key)) testDbEnv[key] = System.getenv(key) }

def useTestDatabase = { Test task ->
    if (!testDbEnv.TEST_DB_URL) {
        task.doFirst { throw new GradleException('테스트 DB 설정이 없습니다. scripts/test-db.sh start 를 실행하거나 TEST_DB_URL/TEST_DB_USERNAME/TEST_DB_PASSWORD 를 지정하세요. (개발 DB로는 통합 테스트를 실행하지 않습니다)') }
        return
    }
    task.systemProperty 'spring.datasource.url', testDbEnv.TEST_DB_URL
    task.systemProperty 'spring.datasource.username', testDbEnv.TEST_DB_USERNAME
    task.systemProperty 'spring.datasource.password', testDbEnv.TEST_DB_PASSWORD
    task.doFirst {
        def matcher = testDbEnv.TEST_DB_URL =~ /jdbc:\w+:\/\/([^:\/]+):?(\d+)?\//
        if (matcher.find()) {
            def host = matcher.group(1), port = (matcher.group(2) ?: '3306') as int
            try { new Socket().withCloseable { it.connect(new InetSocketAddress(host, port), 3000) } }
            catch (IOException ignored) { throw new GradleException("테스트 DB(${host}:${port})에 연결할 수 없습니다. scripts/test-db.sh start 로 실행했는지 확인하세요.") }
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // 백엔드는 .env를 읽는다(spring.config.import). 테스트가 개발자의 실제 AI 키로 외부 API를 호출하지 않도록 AI 설정을 비운다.
    // 실제 호출 검증은 LIVE_AI_TEST=1 로 실행할 때만 한다(LiveAiIntegrationTest).
    if (System.getenv('LIVE_AI_TEST') != '1') {
        systemProperty 'app.ai.endpoint', ''
        systemProperty 'app.ai.api-key', ''
    }
    environment 'LIVE_AI_TEST', System.getenv('LIVE_AI_TEST') ?: ''
}

tasks.named('test') { useTestDatabase(it) }

tasks.register('unitTest', Test) {
    description = 'DB가 필요 없는 단위 테스트'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    exclude integrationPatterns
}

tasks.register('integrationTest', Test) {
    description = '테스트 전용 DB를 사용하는 통합 테스트(API·DB·권한·음성)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include integrationPatterns
    // 실제 외부 AI 호출 검증은 LIVE_AI_TEST=1 일 때만 포함한다(비용·외부 의존).
    if (System.getenv('LIVE_AI_TEST') != '1') exclude '**/LiveAiIntegrationTest.class'
    useTestDatabase(it)
}
