plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}
dependencies {

    // Spring MVC 기반 웹 애플리케이션 개발
    // REST API(@RestController), 요청 매핑(@GetMapping),
    // JSON 변환 등을 제공
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

    // 인증(Authentication) 및 인가(Authorization)
    // 로그인, 권한 관리, JWT 연동 시 사용
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 요청 데이터 검증
    // @Valid, @NotBlank, @Email, @Size 등을 사용
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

    // Lombok 사용
    // 컴파일 시 Getter, Setter, Builder 등을 자동 생성
    compileOnly 'org.projectlombok:lombok'

    // Lombok 어노테이션 처리기
    annotationProcessor 'org.projectlombok:lombok'

    // Spring Boot 통합 테스트
    // JUnit5, MockMvc, AssertJ 등을 포함
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // Spring Security 관련 테스트 지원
    // @WithMockUser 등을 사용 가능
    testImplementation 'org.springframework.security:spring-security-test'

    // 테스트 코드에서도 Lombok 사용
    testCompileOnly 'org.projectlombok:lombok'

    // 테스트 코드 Lombok 어노테이션 처리기
    testAnnotationProcessor 'org.projectlombok:lombok'

    //jjwt-api
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // 비밀번호 재설정 인증 코드 메일 발송 (SMTP)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 한글 글꼴을 임베딩한 PDF 리포트 생성 (Apache License 2.0)
    implementation 'org.apache.pdfbox:pdfbox:3.0.7'

    // 테스트용 인메모리 SMTP 서버 (Apache License 2.0)
    testImplementation 'com.icegreen:greenmail-junit5:2.1.3'
}

tasks.named('test') {
    useJUnitPlatform()
}
