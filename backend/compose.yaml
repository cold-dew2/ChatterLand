services:
  db:
    image: mysql:8.4
    container_name: chatterland-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chatterland
      MYSQL_USER: ${DB_USERNAME:-chatterland}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chatterland_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_change_me}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - chatterland-mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  chatterland-mysql-data:
