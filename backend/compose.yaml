services:
  db:
    image: mariadb:11.4
    container_name: chatterland-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: chatterland
      MARIADB_USER: ${DB_USERNAME:-chatterland}
      MARIADB_PASSWORD: ${DB_PASSWORD:-chatterland_dev}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_change_me}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - chatterland-db-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  chatterland-db-data:
