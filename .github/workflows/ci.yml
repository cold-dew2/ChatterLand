# ChatterLand CI: 단위 → 통합 → 프런트 → E2E를 분리해 실행한다.
# - 테스트 DB는 MariaDB 서비스 컨테이너(개발 DB와 무관). 비밀번호는 CI 전용 임시 값이다.
# - whisper 모델·Mailpit이 없으면 SKIPPED가 아니라 FAIL(REQUIRE_SPEECH_MODEL / REQUIRE_MAILPIT).
# - 실제 비밀값(.env)은 사용하지 않는다. JWT_SECRET은 실행마다 무작위로 만든다.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  REQUIRE_SPEECH_MODEL: "true"
  REQUIRE_MAILPIT: "true"
  # 앱·테스트가 한국 날짜 기준으로 동작하므로 러너와 DB 시간대를 맞춘다(자정 경계 불일치 방지).
  TZ: Asia/Seoul

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/chatterland/whisper
            ~/.cache/chatterland/whisper.cpp
          key: whisper-v1.9.4-large-v3-turbo-q5_0-silero-5.1.2-${{ runner.os }}
      - name: whisper.cpp·모델 준비(체크섬 검증)
        run: scripts/ci/setup-whisper.sh
      - name: 단위 테스트(DB 없음)
        working-directory: backend
        run: sh gradlew unitTest --console=plain
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: backend-unit-results, path: backend/build/test-results/unitTest }

  backend-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: chatterland_test
          MARIADB_USER: chatterland_test
          MARIADB_PASSWORD: ci-only-test-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
          TZ: Asia/Seoul
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=3s --health-retries=20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_DB_URL: jdbc:mariadb://127.0.0.1:3306/chatterland_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      TEST_DB_USERNAME: chatterland_test
      TEST_DB_PASSWORD: ci-only-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/chatterland/whisper
            ~/.cache/chatterland/whisper.cpp
          key: whisper-v1.9.4-large-v3-turbo-q5_0-silero-5.1.2-${{ runner.os }}
      - run: scripts/ci/setup-whisper.sh
      - name: 통합 테스트(API·DB·권한·음성·메일)
        working-directory: backend
        run: JWT_SECRET="$(openssl rand -hex 32)" sh gradlew integrationTest --console=plain
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: backend-integration-results, path: backend/build/test-results/integrationTest }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration, frontend]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: chatterland_test
          MARIADB_USER: chatterland_test
          MARIADB_PASSWORD: ci-only-test-password
          MARIADB_ROOT_PASSWORD: ci-only-root-password
          TZ: Asia/Seoul
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=3s --health-retries=20
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
    env:
      TEST_DB_URL: jdbc:mariadb://127.0.0.1:3306/chatterland_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      TEST_DB_USERNAME: chatterland_test
      TEST_DB_PASSWORD: ci-only-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/chatterland/whisper
            ~/.cache/chatterland/whisper.cpp
          key: whisper-v1.9.4-large-v3-turbo-q5_0-silero-5.1.2-${{ runner.os }}
      - run: scripts/ci/setup-whisper.sh
      - run: npm ci
        working-directory: frontend
      - name: Chrome 확인(GitHub 러너 기본 설치)
        run: google-chrome --version
      - name: E2E(백엔드·프런트는 Playwright가 실행, Mailpit은 서비스 컨테이너)
        working-directory: frontend
        run: JWT_SECRET="$(openssl rand -hex 32)" npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: e2e-results, path: frontend/test-results }
